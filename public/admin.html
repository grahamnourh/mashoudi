<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommandeApp — Panneau admin</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> CommandeApp <span style="color:var(--text-dim); font-weight:400;">/ admin</span></div>
  <span id="user-badge"></span>
</header>

<div class="card admin-menu" style="max-width: 720px;">
  <div class="admin-nav">
    <button type="button" class="small nav-btn active" id="nav-add">+ Ajouter une commande</button>
    <button type="button" class="small secondary nav-btn" id="nav-list">Liste des commandes</button>
  </div>
</div>

<div class="card" style="max-width: 720px;" id="view-add">
  <h1>Nouvelle commande</h1>
  <p class="subtitle">Le nom et la quantité sont obligatoires.</p>

  <div class="msg error" id="form-error"></div>
  <div class="msg success" id="form-success"></div>

  <form id="commande-form">
    <div class="field">
      <label>Nom *</label>
      <input type="text" id="nom" required>
    </div>
    <div class="field">
      <label>Quantité *</label>
      <input type="number" id="quantite" min="1" step="1" required>
    </div>

    <button type="submit" id="submit-btn" disabled>Patientez…</button>
  </form>
</div>

<div class="card" style="max-width: 720px; display:none;" id="view-list">
  <h1>Toutes les commandes</h1>
  <p class="subtitle">Uniquement les commandes validées — les brouillons restent privés tant que l'utilisateur ne les a pas validées. Modification/suppression toujours possibles ici.</p>

  <div class="admin-toolbar">
    <span class="count-badge" id="count-badge">— commandes</span>
    <a href="/api/admin/commandes/export"><button type="button">⬇ Exporter en CSV</button></a>
  </div>

  <div id="map" class="map-box"></div>

  <div class="entries-list" id="admin-entries-list"></div>
</div>

<div class="card" style="max-width: 720px;">
  <a href="/dashboard.html"><button type="button" class="secondary">← Retour à mon espace</button></a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/js/admin.js"></script>
</body>
</html>
