<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommandeApp — Mes commandes</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> CommandeApp</div>
  <span id="user-badge"></span>
</header>

<div class="card" id="admin-link-card" style="display:none;">
  <p class="subtitle" style="margin-bottom:12px;">Tu es connecté en tant qu'administrateur.</p>
  <a href="/admin.html"><button type="button">Ouvrir le panneau admin</button></a>
</div>

<div class="card tab-menu">
  <div class="tab-nav">
    <button type="button" class="small nav-btn active" id="nav-commande">Nouvelle commande</button>
    <button type="button" class="small secondary nav-btn" id="nav-settings">Paramètres</button>
  </div>
</div>

<div class="card" id="view-commande">
  <h1>Nouvelle commande</h1>
  <p class="subtitle">Le nom et la quantité sont obligatoires. Une fois validée, la commande n'est plus consultable.</p>

  <div class="msg error" id="form-error"></div>
  <div class="msg success" id="form-success"></div>

  <form id="commande-form">
    <div class="field">
      <label>Nom *</label>
      <input type="text" id="nom" required>
    </div>
    <div class="field">
      <label>Quantité *</label>
      <input type="number" id="quantite" min="1" step="1" required>
    </div>

    <button type="submit" id="submit-btn" disabled>Patientez…</button>
  </form>
</div>

<div class="card" style="display:none;" id="view-settings">
  <h1>Paramètres</h1>
  <p class="subtitle">Modifier ton mot de passe.</p>

  <div class="msg error" id="password-error"></div>
  <div class="msg success" id="password-success"></div>

  <form id="password-form">
    <div class="field">
      <label>Mot de passe actuel *</label>
      <input type="password" id="current-password" required autocomplete="current-password">
    </div>
    <div class="field">
      <label>Nouveau mot de passe *</label>
      <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirmer le nouveau mot de passe *</label>
      <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
    </div>

    <button type="submit">Changer le mot de passe</button>
  </form>
</div>

<div class="card">
  <button class="secondary" id="logout-btn">Se déconnecter</button>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
