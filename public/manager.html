<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommandeApp — Manager</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="dot"></span> CommandeApp <span style="color:var(--text-dim); font-weight:400;">/ manager</span></div>
    <span id="user-badge" class="mono"></span>

    <nav class="tab-nav-vertical">
      <button type="button" class="small nav-btn active" id="nav-list">Tableau des commandes</button>
      <button type="button" class="small secondary nav-btn" id="nav-add">+ Ajouter une commande</button>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="card" id="view-list">
      <div class="admin-toolbar">
        <span class="count-badge" id="count-badge">— commandes</span>
      </div>

      <div class="filters-bar">
        <div class="field">
          <label>Utilisateur</label>
          <input type="text" id="filter-user" placeholder="@utilisateur">
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="filter-date">
        </div>
        <div class="field">
          <label>Nom du client</label>
          <input type="text" id="filter-nom" placeholder="Nom du client">
        </div>
        <button type="button" class="small secondary" id="filter-reset">Réinitialiser</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Utilisateur</th>
              <th>Date et heure</th>
              <th>Nom du client</th>
              <th>Quantité</th>
              <th>Prix total (FCFA)</th>
              <th>Commentaires</th>
            </tr>
          </thead>
          <tbody id="commandes-tbody"></tbody>
          <tfoot>
            <tr>
              <td colspan="3">Total</td>
              <td id="total-quantite-cell">—</td>
              <td id="total-cout-cell">—</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="card" style="display:none;" id="view-add">
      <h1>Nouvelle commande</h1>
      <p class="subtitle">Le nom et la quantité sont obligatoires.</p>

      <div class="msg error" id="form-error"></div>
      <div class="msg success" id="form-success"></div>

      <form id="commande-form">
        <div class="field">
          <label>Nom *</label>
          <input type="text" id="nom" required>
        </div>
        <div class="field">
          <label>Quantité *</label>
          <input type="number" id="quantite" min="1" step="1" required>
        </div>

        <button type="submit" id="submit-btn" disabled>Patientez…</button>
      </form>
    </div>
  </main>
</div>

<script src="/js/manager.js"></script>
<script src="/js/logout.js"></script>
</body>
</html>
